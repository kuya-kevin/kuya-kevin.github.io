name: Upload to S3

on:
  push:
    branches:
      - main  # Trigger the action on push to the main branch
  pull_request:
    branches:
      - main  # Trigger on pull requests to the main branch

jobs:
  upload:
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up AWS CLI
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  # Set your desired region, e.g., us-east-1

      # Sync static assets to S3 with long cache (images, css, js, fonts, etc.)
      - name: Upload static assets to S3
        run: |
          aws s3 sync . s3://kevinelaba.com \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.html" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      # Sync HTML files with no-cache so updates show up immediately
      - name: Upload HTML files to S3
        run: |
          aws s3 sync . s3://kevinelaba.com \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      # Invalidate CloudFront cache so changes are visible right away
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
